<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f5f5}
.top{background:#0f1e42;color:#fff;padding:6px 4%;font-size:11px;display:flex;justify-content:space-between}

.card img{width:100%;height:165px;object-fit:contain;padding:6px}
.badge70{position:absolute;top:6px;left:6px;background:#ff6a00;color:#fff;font-size:10px;padding:4px 7px;border-radius:5px;font-weight:700}

</head>
<body>
<div class="top"><div>📍 EPHESIAN STORE | RC:9874607 | EASY BUY 70/30</div><div>07081632713</div></div>
<div class="header"><a href="index.html" style="text-decoration:none;font-weight:700;color:#0f1e42">← Home</a><span style="margin-left:10px;font-weight:700">Easy Buy - Pay 70% Now, 30% Later</span></div>

<div style="margin:14px 4%;background:linear-gradient(90deg,#0f1e42,#ff6a00);color:#fff;padding:18px;border-radius:12px">

</div>

<div class="grid" id="easyGrid">Loading Easy Buy products...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBjR6WNrd8ziXnegOXZv_RJtGFVbZJN8",authDomain:"ephesian-store.firebaseapp.com",projectId:"ephesian-store",storageBucket:"ephesian-store.firebasestorage.app",messagingSenderId:"109847556546",appId:"1:109847556546:web:5c7f8a9b0c1d2e3f"};
const db=getFirestore(initializeApp(firebaseConfig));

onSnapshot(collection(db,"products"), snap=>{
 let html='';
 snap.forEach(d=>{
  let p=d.data();
  // ONLY SHOW PRODUCTS WHERE easyBuy == true
  if(p.easyBuy===true || p.isEasyBuy===true){
    html+=`<div class="card" onclick="location.href='shop.html?id=${d.id}'"><span class="badge70">EASY BUY 70/30</span><img src="${(p.images||[p.image])[0]}"><div class="price">${p.name}<br>₦${Number(p.price).toLocaleString()}<br><small style="color:#2a7d2a">Pay 70%: ₦${Math.round(p.price*0.7).toLocaleString()}</small></div></div>`;
  }
 });
 document.getElementById('easyGrid').innerHTML= html || '<p style="padding:20px">No Easy Buy products yet. Go to Firebase and add field easyBuy = true for products you want here.</p>';
});
</script>
</body>
</html>
