<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Buy - Ephesian Store</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f5f5;padding-bottom:80px}
.top{background:#0f1e42;color:#fff;padding:6px 4%;font-size:11px;display:flex;justify-content:space-between}
.header{background:#fff;padding:12px 4%;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.header a{text-decoration:none;font-weight:700;color:#0f1e42}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 4%}
.card{background:#fff;border:1px solid #f0f0f0;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:160px;object-fit:contain;padding:6px}
.badge70{position:absolute;top:6px;left:6px;background:#ff6a00;color:#fff;font-size:10px;padding:4px 7px;border-radius:5px;font-weight:700}
.info{padding:10px}
.info h3{font-size:12px;height:32px;overflow:hidden}
.price{font-weight:700;color:#0f1e42;font-size:13px}
.pay{font-size:11px;color:#2a7d2a;background:#e8f5e9;padding:4px 6px;border-radius:5px;margin-top:4px;display:inline-block}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top"><div>📍 Ayegun Olomi | RC:9874607 | EASY BUY</div><div>07081632713</div></div>
<div class="header"><a href="index.html">← Home</a><span style="margin-left:10px">Easy Buy - Pay 70% Now, 30% Later</span><a href="shop.html" style="margin-left:auto;color:#ff6a00">Shop</a></div>

<div style="margin:14px 4%;background:linear-gradient(90deg,#0f1e42,#ff6a00);color:#fff;padding:20px;border-radius:12px">
<h2>Easy Buy Products 🛒</h2><p style="font-size:13px;margin-top:6px">Pay 70% now, balance 30% later. Choose any product below.</p>
</div>

<div class="grid" id="easyGrid">Loading products...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBjR6WNrd8ziXnegOXZv_RJtGFVbZJN8",authDomain:"ephesian-store.firebaseapp.com",projectId:"ephesian-store",storageBucket:"ephesian-store.firebasestorage.app",messagingSenderId:"109847556546",appId:"1:109847556546:web:5c7f8a9b0c1d2e3f"};
const db=getFirestore(initializeApp(firebaseConfig));

onSnapshot(collection(db,"products"), snap=>{
 let html='';
 snap.forEach(d=>{
  let p=d.data();
  let img=(p.images||[p.image]||['https://via.placeholder.com/200'])[0];
  html+=`
  <div class="card" onclick="location.href='shop.html'">
   <span class="badge70">70/30</span>
   <img src="${img}">
   <div class="info">
    <h3>${p.name}</h3>
    <div class="price">₦${Number(p.price).toLocaleString()}</div>
    <div class="pay">Pay 70%: ₦${Math.round(p.price*0.7).toLocaleString()}</div>
   </div>
  </div>`;
 });
 document.getElementById('easyGrid').innerHTML= html || 'No products found';
});
</script>
</body>
</html>
