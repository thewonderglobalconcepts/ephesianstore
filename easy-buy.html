<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBjR6WNrd8ziXnegOXZv_RJtGFVbZJN8",authDomain:"ephesian-store.firebaseapp.com",projectId:"ephesian-store",storageBucket:"ephesian-store.firebasestorage.app",messagingSenderId:"109847556546",appId:"1:109847556546:web:5c7f8a9b0c1d2e3f"};
const db=getFirestore(initializeApp(firebaseConfig));

function getDiscountData(p){
 let nowPrice=Number(p.price);
 let oldPrice=Number(p.originalPrice||0);
 if(!oldPrice||oldPrice<=nowPrice){
   let disc=Number(p.discount||0);
   if(disc>0) oldPrice=Math.round(nowPrice/(1-disc/100)); else oldPrice=nowPrice;
 }
 let perc=oldPrice>nowPrice?Math.round((1-nowPrice/oldPrice)*100):(p.discount||0);
 return {nowPrice,oldPrice,perc};
}

const q = query(collection(db,"products"), where("easyBuy","==",true));

onSnapshot(q, (snap)=>{
 let html='';
 snap.forEach(d=>{
  let p=d.data();
  let img=(p.images||[p.image]||['https://via.placeholder.com/200'])[0];
  let {nowPrice,oldPrice,perc}=getDiscountData(p);
  html+=`
  <div class="card" onclick="location.href='shop.html'">
   <span class="badge70">70/30</span>
   ${perc>0?`<span class="b-off">-${perc}%</span>`:''}
   <img src="${img}" onerror="this.src='https://via.placeholder.com/200'">
   <div class="info">
    <h3>${p.name}</h3>
    <div class="price-row"><span class="price-now">₦${nowPrice.toLocaleString()}</span>${oldPrice>nowPrice?`<span class="price-old">₦${oldPrice.toLocaleString()}</span>`:''}</div>
    <div class="pay">Pay 70% Now: ₦${Math.round(nowPrice*0.7).toLocaleString()}</div>
   </div>
  </div>`;
 });
 // CUSTOMER FRIENDLY - NO ADMIN BUTTON
 document.getElementById('easyGrid').innerHTML= html || `
  <div style="grid-column:1/-1;text-align:center;padding:50px 20px;background:#fff;border-radius:12px">
   <div style="font-size:60px">🛒</div>
   <h3 style="margin-top:12px;color:#0f1e42">Easy Buy Products Coming Soon</h3>
   <p style="font-size:12px;margin-top:8px;color:#666;line-height:1.5">Our Easy Buy collection is being updated. You can still shop all products and enjoy discounts.</p>
   <br>
   <a href="shop.html" style="background:#0f1e42;color:#fff;padding:12px 22px;border-radius:25px;text-decoration:none;font-weight:700;font-size:12px;display:inline-block">Continue Shopping →</a>
  </div>`;
}, (err)=>{
 document.getElementById('easyGrid').innerHTML=`<div style="grid-column:1/-1;padding:20px;text-align:center;color:red">Error loading: ${err.message}. Please open via website not as file. Use Live Server.</div>`;
});
</script>
