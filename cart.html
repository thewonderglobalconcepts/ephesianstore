<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - EPHESIANS STORE v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f2f2f2;padding-bottom:120px}
.top-bar{background:#fff;padding:12px 4%;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.back{font-size:20px;text-decoration:none;color:#000}
.title{font-weight:700;font-size:16px}
.summary{background:#fff;padding:12px 4%;margin-bottom:2px}
.summary h4{font-size:12px;color:#888;letter-spacing:.5px}
.subtotal{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.subtotal b{font-size:16px}
.card{background:#fff;padding:12px 4%;border-bottom:8px solid #f2f2f2}
.row{display:flex;gap:12px}
.card img{width:80px;height:80px;object-fit:contain;border:1px solid #eee;border-radius:6px}
.info{flex:1}
.info h3{font-size:13px;line-height:1.3;max-height:36px;overflow:hidden;font-weight:400}
.price{font-weight:700;margin-top:4px;font-size:15px}
.old{font-size:11px;color:#888;text-decoration:line-through;margin-left:6px}
.disc{background:#feefde;color:#ff6a00;font-size:11px;padding:2px 6px;border-radius:4px;font-weight:700;margin-left:6px}
.stock{font-size:11px;color:#2a7d2a;margin-top:2px}
.express{color:#000;font-weight:800;font-size:11px;margin-top:4px;letter-spacing:.3px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.remove{color:#ff6a00;font-size:13px;font-weight:600;background:none;border:none;cursor:pointer}
.qty{display:flex;align-items:center;gap:10px}
.qty button{background:#ffbd8a;color:#fff;border:none;width:32px;height:32px;border-radius:6px;font-size:18px;font-weight:700;cursor:pointer}
.qty span{font-weight:700;min-width:18px;text-align:center}
.checkout-bar{position:fixed;bottom:55px;left:0;right:0;background:#fff;padding:10px 4%;display:flex;gap:10px;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:201}
.call{width:46px;height:46px;border:1.5px solid #ff6a00;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#ff6a00;font-size:22px;text-decoration:none}
.check-btn{flex:1;background:#ff6a00;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 3px 8px rgba(255,106,0,.3)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;z-index:200}
.bottom-nav a{text-decoration:none;color:#888;font-size:10px;text-align:center}
.bottom-nav a.active{color:#ff6a00}
.empty{text-align:center;padding:60px 20px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;padding:12px}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:20px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="top-bar">
<a href="shop.html" class="back">←</a>
<div class="title">Cart</div>
</div>

<div class="summary">
<h4>CART SUMMARY</h4>
<div class="subtotal"><span>Subtotal</span><b id="subtotal">₦0</b></div>
<div style="font-size:11px;color:#888;margin-top:4px">Cart (<span id="cartNum">0</span>) • Pay 70% Now: <b id="pay70" style="color:#2a7d2a">₦0</b></div>
</div>

<div id="list"></div>

<div class="checkout-bar">
<a href="tel:07081632713" class="call">📞</a>
<button class="check-btn" id="checkBtn" onclick="openCheckout()">Checkout (₦0)</button>
</div>

<div class="bottom-nav">
<a href="index.html">🏠<br>Home</a>
<a href="shop.html">🛍️<br>Categories</a>
<a href="cart.html" class="active">🛒<br>Cart</a>
<a href="wishlist.html">❤️<br>Wishlist</a>
<a href="contact.html">👤<br>Account</a>
</div>

<div class="modal" id="checkoutModal">
<div class="modal-box">
<h3 style="color:#0f1e42">Guest Checkout - RC 9874607</h3>
<div id="modalItems" style="font-size:11px;margin:10px 0"></div>
<input id="custName" placeholder="Full Name" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:8px">
<input id="custPhone" placeholder="Phone 080..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:8px">
<input id="custAddr" placeholder="Address Ayegun Olomi..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:8px">
<div style="margin-top:10px">
<label style="display:flex;gap:8px;padding:10px;border:1.5px solid #ff6a00;border-radius:8px;margin-bottom:6px;font-size:12px"><input type="radio" name="pay" value="transfer" checked onchange="togglePay()"> 💳 Pay with Transfer (70%)</label>
<label style="display:flex;gap:8px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:12px"><input type="radio" name="pay" value="delivery" onchange="togglePay()"> 🚚 Pay on Delivery</label>
</div>
<div id="transferBox" style="background:#fff8e1;padding:10px;border-radius:8px;margin-top:8px;font-size:11px">
Bank: OPay - 8108163271<br>Amount: <b id="transferAmt">₦0</b><br><small>After transfer click confirm</small>
</div>
<button onclick="placeOrder()" style="width:100%;background:#0f1e42;color:#fff;padding:12px;border:none;border-radius:10px;font-weight:700;margin-top:10px">Confirm Order</button>
<button onclick="document.getElementById('checkoutModal').style.display='none'" style="width:100%;background:#eee;padding:10px;border:none;border-radius:10px;margin-top:8px">Cancel</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBjR6WNrd8ziXnegOXZv_RJtGFVbZJN8",authDomain:"ephesian-store.firebaseapp.com",projectId:"ephesian-store",storageBucket:"ephesian-store.firebasestorage.app",messagingSenderId:"109847556546",appId:"1:109847556546:web:5c7f8a9b0c1d2e3f"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);

let cart=JSON.parse(localStorage.getItem('ephesian_cart_v2')||'[]');
function save(){localStorage.setItem('ephesian_cart_v2',JSON.stringify(cart)); render();}
function render(){
 let div=document.getElementById('list');
 let total=cart.reduce((s,i)=>s+(i.price*i.qty),0);
 let pay70=Math.round(total*0.7);
 document.getElementById('subtotal').innerText='₦'+total.toLocaleString();
 document.getElementById('pay70').innerText='₦'+pay70.toLocaleString();
 document.getElementById('cartNum').innerText=cart.length;
 document.getElementById('checkBtn').innerText=`Checkout (₦ ${total.toLocaleString()})`;
 document.getElementById('transferAmt').innerText='₦'+pay70.toLocaleString();
 if(!cart.length){div.innerHTML=`<div class="empty">🛒<br><br>Cart empty<br><br><a href="shop.html" style="background:#ff6a00;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none">Start Shopping</a></div>`;return;}
 div.innerHTML=cart.map((it,i)=>`
  <div class="card">
    <div class="row">
      <img src="${it.image||'https://via.placeholder.com/80'}" >
      <div class="info">
        <h3>${it.name}</h3>
        <div style="font-size:11px;color:#888">Variation: Default</div>
        <div class="price">₦${(it.price*it.qty).toLocaleString()} <span class="old">₦${Math.round(it.price*1.25*it.qty).toLocaleString()}</span> <span class="disc">-69%</span></div>
        <div class="stock">${it.qty<=3?'Few units left':'In Stock'}</div>
        <div class="express">JUMIA ● EXPRESS</div>
      </div>
    </div>
    <div class="actions">
      <button class="remove" onclick="removeItem(${i})">Remove</button>
      <div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${it.qty}</span><button onclick="changeQty(${i},1)">+</button></div>
    </div>
  </div>
 `).join('');
}
window.removeItem=(i)=>{cart.splice(i,1);save();}
window.changeQty=(i,d)=>{cart[i].qty+=d; if(cart[i].qty<1) cart[i].qty=1; save();}
window.openCheckout=()=>{
 if(!cart.length){alert('Cart empty');return;}
 let total=cart.reduce((s,i)=>s+(i.price*i.qty),0);
 document.getElementById('modalItems').innerHTML=cart.map(i=>`• ${i.name} x${i.qty} - ₦${(i.price*i.qty).toLocaleString()}`).join('<br>')+`<br><br><b>Total: ₦${total.toLocaleString()} | Pay 70%: ₦${Math.round(total*0.7).toLocaleString()}</b>`;
 document.getElementById('checkoutModal').style.display='flex';
}
window.togglePay=()=>{let v=document.querySelector('input[name=pay]:checked').value; document.getElementById('transferBox').style.display=v==='transfer'?'block':'none';}
window.placeOrder=async()=>{
 let name=document.getElementById('custName').value.trim();
 let phone=document.getElementById('custPhone').value.trim();
 let addr=document.getElementById('custAddr').value.trim();
 let pay=document.querySelector('input[name=pay]:checked').value;
 if(!name||!phone||!addr){alert('Fill details');return;}
 let total=cart.reduce((s,i)=>s+(i.price*i.qty),0);
 try{
  await addDoc(collection(db,"orders"),{customer:name,phone,address:addr,items:cart,total,pay70:Math.round(total*0.7),paymentMethod:pay,status:pay==='transfer'?'PAID_TO_CONFIRM':'PENDING',createdAt:serverTimestamp()});
  let msg=`NEW ORDER v2.0%0AName:${name}%0APhone:${phone}%0AAddr:${addr}%0ATotal:₦${total}%0AItems:${cart.map(i=>i.name+' x'+i.qty).join(', ')}`;
  window.open('https://wa.me/2347081632713?text='+msg,'_blank');
  cart=[];save();document.getElementById('checkoutModal').style.display='none';alert('Order placed!');
 }catch(e){alert(e.message)}
}
render();
</script>
</body>
</html>
