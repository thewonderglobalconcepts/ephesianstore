<!DOCTYPE html>
<html>
<head>
<title>Admin - Ephesian Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; background:#f5f5f5; padding:20px;}
.box{background:white; padding:20px; border-radius:15px; max-width:500px; margin:20px auto;}
input, button{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;}
button{background:#FFD700; font-weight:bold; border:none; cursor:pointer;}
#loginBox{display:block;} #adminBox{display:none;}
.prod{display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee;}
</style>
</head>
<body>

<div id="loginBox" class="box">
<h2>Admin Login 🔐</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="error" style="color:red;"></p>
</div>

<div id="adminBox" class="box">
<h2>Add New Product ➕</h2>
<input id="pName" placeholder="Product Name e.g. Nike Air">
<input id="pPrice" type="number" placeholder="Price e.g. 25000">
<input id="pImage" placeholder="Image URL (from your images folder e.g. images/nike.jpg)">
<input id="pCat" placeholder="Category e.g. Shoes">
<button onclick="addProduct()">Add Product</button>
<button onclick="logout()" style="background:#ccc;">Logout</button>
<hr>
<h3>Current Products</h3>
<div id="productList"></div>
</div>

<script>
const ADMIN_USER = "ephesian";
const ADMIN_PASS = "ephesian123";

function login(){
  if(document.getElementById('user').value === ADMIN_USER && document.getElementById('pass').value === ADMIN_PASS){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
    showProducts();
  } else {
    document.getElementById('error').innerText = "Wrong username or password!";
  }
}
function logout(){ location.reload(); }

function getProducts(){ return JSON.parse(localStorage.getItem('ephesian_products') || '[]'); }
function saveProducts(p){ localStorage.setItem('ephesian_products', JSON.stringify(p)); }

function addProduct(){
  let name = document.getElementById('pName').value;
  let price = document.getElementById('pPrice').value;
  let image = document.getElementById('pImage').value;
  let cat = document.getElementById('pCat').value;
  if(!name || !price){ alert('Name and Price needed!'); return; }
  let products = getProducts();
  products.push({name, price:parseInt(price), image:image||'https://via.placeholder.com/300', category:cat||'General'});
  saveProducts(products);
  alert(name + ' added!');
  document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pImage').value='';
  showProducts();
}
function deleteProduct(i){
  let products = getProducts();
  products.splice(i,1);
  saveProducts(products);
  showProducts();
}
function showProducts(){
  let list = document.getElementById('productList');
  let products = getProducts();
  list.innerHTML='';
  products.forEach((p,i)=>{
    list.innerHTML+=`<div class="prod"><span>${p.name} - ₦${p.price}</span> <button onclick="deleteProduct(${i})" style="width:auto; background:#ff4444; color:white; padding:5px 10px;">X</button></div>`;
  });
}
</script>
</body>
</html>
