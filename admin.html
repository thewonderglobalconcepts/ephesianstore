<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Ephesian</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-center mb-6">Ephesian Admin - Add Product</h1>

  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <h2 class="font-bold mb-4">Add New Product (With 8 Pictures Gallery)</h2>
    <input id="pName" placeholder="Product Name e.g Toothbrush Set" class="w-full p-3 border rounded-xl mb-3">
    <input id="pPrice" placeholder="Price e.g 5000" type="number" class="w-full p-3 border rounded-xl mb-3">

    <p class="font-bold text-sm mb-2">Product Images (Add up to 8 - like toothbrush set)</p>
    <input id="pImage" placeholder="Image 1 - Main Image Required" class="w-full p-3 border rounded-xl mb-2">
    <input id="pImage2" placeholder="Image 2 - Optional" class="w-full p-3 border rounded-xl mb-2">
    <input id="pImage3" placeholder="Image 3 - Optional" class="w-full p-3 border rounded-xl mb-2">
    <input id="pImage4" placeholder="Image 4 - Optional" class="w-full p-3 border rounded-xl mb-2">
    <input id="pImage5" placeholder="Image 5 - Optional" class="w-full p-3 border rounded-xl mb-2">
    <input id="pImage6" placeholder="Image 6 - Optional" class="w-full p-3 border rounded-xl mb-2">
    <input id="pImage7" placeholder="Image 7 - Optional" class="w-full p-3 border rounded-xl mb-2">
    <input id="pImage8" placeholder="Image 8 - Optional" class="w-full p-3 border rounded-xl mb-3">

    <select id="pCat" class="w-full p-3 border rounded-xl mb-3">
      <option>General</option>
      <option>Home</option>
      <option>Kitchen</option>
      <option>Beauty</option>
      <option>Toothbrush</option>
    </select>

    <button onclick="addProduct()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Add Product With Gallery</button>
  </div>

  <div class="bg-white p-6 rounded-xl shadow mb-6">
    <h2 class="font-bold mb-4">Hide Product</h2>
    <input id="hideName" placeholder="Type product name" class="w-full p-3 border rounded-xl mb-3">
    <button onclick="hideProduct()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold">Hide From Shop</button>
    <div id="list" class="mt-4"></div>
  </div>

  <div class="text-center">
    <button onclick="logout()" class="text-red-600 underline">Logout</button>
    <a href="shop.html" class="ml-4 text-blue-600 underline">Go to Shop</a>
  </div>
</div>

<script>
const PRODUCTS_KEY='ephesian_products';
const HIDDEN_KEY='ephesian_hidden_products';

function getProducts(){ return JSON.parse(localStorage.getItem(PRODUCTS_KEY)||'[]'); }
function getHidden(){ return JSON.parse(localStorage.getItem(HIDDEN_KEY)||'[]'); }

function addProduct(){
  const name=document.getElementById('pName').value.trim();
  const price=document.getElementById('pPrice').value.trim();
  const category=document.getElementById('pCat').value;

  let allImages=[];
  for(let i=1;i<=8;i++){
    let id=i===1?'pImage':'pImage'+i;
    let el=document.getElementById(id);
    if(el && el.value.trim()) allImages.push(el.value.trim());
  }

  if(!name||!price){ alert('Add name and price'); return; }
  if(allImages.length===0){ alert('Add at least 1 image'); return; }

  const list=getProducts();
  list.push({
    id: Date.now(),
    name: name,
    price: Number(price),
    image: allImages[0],
    images: allImages,
    category: category
  });

  localStorage.setItem(PRODUCTS_KEY, JSON.stringify(list));

  document.getElementById('pName').value='';
  document.getElementById('pPrice').value='';
  for(let i=1;i<=8;i++){
    let id=i===1?'pImage':'pImage'+i;
    let el=document.getElementById(id);
    if(el) el.value='';
  }

  render();
  alert('✅ Added with '+allImages.length+' pictures! Like toothbrush set!');
}

function hideProduct(){
  const n=document.getElementById('hideName').value.trim();
  if(!n){ alert('Type product name'); return; }
  let h=getHidden(); if(!h.includes(n)) h.push(n);
  localStorage.setItem(HIDDEN_KEY, JSON.stringify(h));
  document.getElementById('hideName').value=''; render();
  alert(n+' hidden from shop. Refresh shop to see.');
}

function unhide(name){
  let h=getHidden(); h=h.filter(x=>x!==name);
  localStorage.setItem(HIDDEN_KEY, JSON.stringify(h));
  render();
}

function render(){
  const list=getProducts();
  const h=getHidden();
  const div=document.getElementById('list');
  div.innerHTML='<p class="font-bold mb-2">Products: '+list.length+'</p>' + list.map(p=>`
    <div class="flex justify-between items-center border-b py-2">
      <span>${p.name} - ${p.images? p.images.length : 1} pics</span>
      <button onclick="unhide('${p.name}')" class="text-xs bg-gray-200 px-2 py-1 rounded">Unhide</button>
    </div>
  `).join('') + '<p class="font-bold mt-4">Hidden: '+h.join(', ')+'</p>';
}

function logout(){ localStorage.removeItem('ephesian_admin'); location.reload(); }
function showAdmin(){}

render();
</script>

</body>
</html>
